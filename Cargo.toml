[package]
name = "mineshift"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["engine"]

[dependencies]
minecore = { path = "engine" }
eframe = "0.36.2"
egui = "0.36.2"
rand = "0.8.5"
rusqlite = { version = "0.31.0", features = ["bundled"] }
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
rodio = "0.20"
